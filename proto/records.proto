syntax = "proto3";

package mkt_data;

// Near-raw records (docs/phase-3.md, step 2): what isn't a time series, as each
// source publishes it. An auction's terms and results (TD-SECURITIES,
// FD-AUCTIONS: record_type "auction", keyed CUSIP/issue date) and the monthly
// stripped-securities table (FD-MSPD-STRIPS: "stripped_security" keyed
// CUSIP/record date, and its "stripped_total" lines). secmaster-svc reads these
// and builds instruments.
//
// Read by period exactly like Observations: a source's periods with the newest
// capture each one's records came from, so a client re-reads only the periods
// that changed, and one period's records. A record's fields are the source's
// own, every value a string as printed, sent as one JSON object. Internal-only
// per ADR-0020: mkt-data:9090 on the home-platform network. Dates YYYY-MM-DD;
// timestamps ISO 8601 (empty for none).
service Records {
  // Every record source mkt-data captures.
  rpc ListSources(ListRecordSourcesRequest) returns (ListRecordSourcesResponse);
  // A source's periods that have records.
  rpc ListPeriods(ListRecordPeriodsRequest) returns (ListRecordPeriodsResponse);
  // One period's records: current, and optionally superseded (revisions).
  rpc GetPeriod(GetRecordPeriodRequest) returns (PeriodRecords);
}

message ListRecordSourcesRequest {}

message RecordSource {
  string name = 1;          // TD-SECURITIES, FD-AUCTIONS, FD-MSPD-STRIPS
  string description = 2;
  string calendar = 3;      // publication calendar (calendar-svc), e.g. SIFMA-US
  string first_period = 4;  // earliest period asked for, YYYY-MM
  int32 periods = 5;        // periods with records so far
}

message ListRecordSourcesResponse {
  repeated RecordSource sources = 1;
}

message ListRecordPeriodsRequest {
  string source = 1;
  string since_period = 2;  // optional: only periods >= this one (YYYY-MM)
}

message RecordPeriodInfo {
  string period = 1;            // YYYY-MM
  int64 latest_capture_id = 2;  // newest capture any of the period's rows came from (changes when records change)
  int32 records = 3;            // current records
  string first_date = 4;
  string last_date = 5;
}

message ListRecordPeriodsResponse {
  string source = 1;
  repeated RecordPeriodInfo periods = 2;
}

message GetRecordPeriodRequest {
  string source = 1;
  string period = 2;
  bool include_superseded = 3;
}

message SourceRecord {
  int64 id = 1;
  string record_type = 2;   // auction, stripped_security, stripped_total
  string source_key = 3;    // 912810UW6/2026-10-15
  string as_of = 4;         // the date that places it in its period (auction date, record date)
  string fields_json = 5;   // the source's fields as published, a JSON object of strings
  int64 capture_id = 6;
  string valid_from = 7;
  string valid_to = 8;      // empty: current
}

message PeriodRecords {
  string source = 1;
  string period = 2;
  repeated SourceRecord records = 3;
}
