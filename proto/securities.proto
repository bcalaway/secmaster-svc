// secmaster-svc's service API (mkt-data's docs/phase-2.md, Part B step 4).
// Internal only: secmaster-svc:9090 on the home-platform network (ADR-0020).
// quote-svc resolves source keys to instruments with Resolve; mkt-api looks
// instruments up and adds their short names to every answer.

syntax = "proto3";

package secmaster_svc;

service Securities {
  // One instrument by sec_id, or by short name or alias (case-insensitive),
  // with its identifiers and notes. NOT_FOUND if there's none.
  rpc GetInstrument(GetInstrumentRequest) returns (Instrument);
  // Instruments, by type, curve and tenor (identifiers and notes left out).
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse);
  // Map a source's keys to instruments in one call (the batch lookup
  // quote-svc uses). Unknown keys come back in `unknown`, not as an error.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // Instruments whose name, alias, identifier or description contains the query.
  rpc Search(SearchRequest) returns (ListInstrumentsResponse);
  // Treasury securities by maturity (mkt-data's docs/phase-3.md, step 9):
  // outstanding ones unless include_inactive, with the terms a list shows and
  // their on-the-run aliases on as_of.
  rpc ListSecurities(ListSecuritiesRequest) returns (ListSecuritiesResponse);
  // One Treasury security or STRIPS in full: instrument, terms with their
  // provenance and checks, every auction, on-the-run aliases, a TIPS's index
  // ratio. NOT_FOUND if there's none or it isn't a Treasury security.
  rpc GetSecurity(GetSecurityRequest) returns (Security);
  // The auction calendar: auctions held or announced from start to end, by
  // auction date; announced ones without results yet.
  rpc ListAuctions(ListAuctionsRequest) returns (ListAuctionsResponse);
}

message GetInstrumentRequest {
  oneof key {
    int32 sec_id = 1;
    string name = 2;  // short name or alias: UST-10Y-CMT, UST-6W-CMT
  }
}

message ListInstrumentsRequest {
  string type = 1;   // cmt_yield; empty for all
  string curve = 2;  // UST; empty for all
  bool include_inactive = 3;
}

message ListInstrumentsResponse {
  repeated Instrument instruments = 1;
  int32 total = 2;  // Search: every match (the instruments are one page of them); ListInstruments: unset
}

message ResolveRequest {
  string scheme = 1;           // an mkt-data source name for CMTs: UST-PAR, H15-TCM; or FRED
  repeated string values = 2;  // that source's keys: BC_10YEAR, RIFLGFCY10_N.B
  string as_of = 3;            // YYYY-MM-DD: only identifiers valid then; empty for any current one
}

message ResolveResponse {
  string scheme = 1;
  repeated Match matches = 2;
  repeated string unknown = 3;
}

message Match {
  string value = 1;
  int32 sec_id = 2;
  string short_name = 3;
  string valid_from = 4;  // YYYY-MM-DD, empty when open
  string valid_to = 5;
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;  // 0 means 20
  int32 offset = 3;  // skip this many matches, in the same order (a page at a time)
}

message Instrument {
  int32 sec_id = 1;
  string short_name = 2;
  repeated string aliases = 3;
  string type = 4;
  string currency = 5;
  string country = 6;
  string curve = 7;
  string tenor = 8;     // ISO 8601 duration: P10Y, P6W
  string calendar = 9;  // a calendar-svc name: SIFMA-US
  string status = 10;
  string description = 11;
  repeated InstrumentIdentifier identifiers = 12;
  repeated InstrumentNote notes = 13;
}

message InstrumentIdentifier {
  string scheme = 1;
  string value = 2;
  string valid_from = 3;
  string valid_to = 4;
}

message InstrumentNote {
  string key = 1;
  string date = 2;  // YYYY-MM-DD
  string text = 3;
}

message ListSecuritiesRequest {
  string security_type = 1;  // bill, note, bond, tips, frn; empty for all
  bool include_inactive = 2;  // matured, called, withdrawn too
  string maturing_from = 3;  // YYYY-MM-DD, inclusive; empty for any
  string maturing_to = 4;
  string as_of = 5;  // YYYY-MM-DD for the on-the-run aliases; empty for today (New York)
  int32 limit = 6;  // 0 means 1000; at most 6000
  int32 offset = 7;  // skip this many matches, in maturity order (a page at a time)
}

message ListSecuritiesResponse {
  string as_of = 1;
  int32 total = 2;  // every match; at most `limit` are listed
  repeated SecuritySummary securities = 3;
}

message SecuritySummary {
  int32 sec_id = 1;
  string short_name = 2;  // UST-4.25-2035-08-15
  string cusip = 3;
  string security_type = 4;  // bill, note, bond, tips, frn
  bool cmb = 5;  // cash management bill
  string term = 6;  // the auction program: 10-Year, 26-Week
  string original_term = 7;  // exact: 5-Year 2-Month
  string coupon_rate = 8;  // decimal, 0.0425; empty for bills and FRNs
  string frn_spread = 9;  // decimal; FRNs only
  string issue_date = 10;  // YYYY-MM-DD
  string dated_date = 11;
  string maturity_date = 12;
  string status = 13;  // active, matured, called, withdrawn
  string description = 14;
  repeated string on_the_run = 15;  // UST-10Y-OTR, UST-10Y-OTR-ISSUED
}

message GetSecurityRequest {
  oneof key {
    int32 sec_id = 1;
    string name = 2;  // short name, alias, CUSIP alias or on-the-run name (as of as_of)
  }
  string as_of = 3;  // YYYY-MM-DD; empty for today (New York)
}

message Security {
  Instrument instrument = 1;
  map<string, string> terms = 2;  // every stored term, dates ISO, decimals as stored; empty for none
  map<string, string> provenance = 3;  // term -> "published: TD-SECURITIES <key> <field>" or "derived: <rule>"
  repeated string checks = 4;
  repeated Auction auctions = 5;  // by issue date
  repeated OnTheRun on_the_run = 6;
  map<string, string> index_ratio = 7;  // TIPS on as_of: ref_cpi, base_cpi, index_ratio, method
  map<string, string> strip = 8;  // STRIPS: kind, maturity, underlying
}

message Auction {
  map<string, string> fields = 1;  // auction_date, issue_date, reopening, offering_amount, high_yield, ...
}

message OnTheRun {
  string alias = 1;
  string since = 2;  // YYYY-MM-DD
  string until = 3;  // empty when open
}

message ListAuctionsRequest {
  string start = 1;  // YYYY-MM-DD, inclusive
  string end = 2;    // YYYY-MM-DD, inclusive
  int32 limit = 3;   // 0 means 500
}

message ListAuctionsResponse {
  string start = 1;
  string end = 2;
  repeated AuctionRow auctions = 3;
}

message AuctionRow {
  int32 sec_id = 1;
  string short_name = 2;
  map<string, string> fields = 3;  // cusip, security_type, term, reopening, announcement_date, auction_date,
                                   // issue_date, offering_amount, total_accepted, bid_to_cover, high_yield, ...
}
