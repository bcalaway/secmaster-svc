# Fixings: the security master's seed for the rates and FX rates CME's futures settle on or track
# (mkt-data's docs/phase-4.md, step 4; Bill, 2026-10-07). Like seeds/cmt.toml, no feed defines these, so
# this file is their source of truth, changed only in a reviewed PR.
#
# Identifier schemes are mkt-data's source names and values the source's own keys, so quote-svc maps an
# observation straight to an instrument:
#   NYFED-SOFR, NYFED-EFFR  the New York Fed's reference rates (the record's `type`)
#   FRB-H10-RATES           the Fed's H.10 daily rates, DDP series (RXI$US_N.B.EU: dollars per euro;
#                           RXI_N.B.JA: yen per dollar)
#   FRB-H10                 the H.10 nominal dollar indexes, DDP series
#   ECB-EXR                 the ECB's euro reference rates, SDMX key (EXR.D.JPY.EUR.SP00.A: yen per euro)
#
# Each FX fixing is quoted as its source prints it, never inverted: the short name says which way
# (EURUSD-H10 is dollars per euro, USDJPY-H10 yen per dollar, EURJPY-ECB yen per euro), and `currency`
# is the currency the quote is in. No averages (the SOFR Averages and Index): averaging is analytics,
# for a later phase (Bill, 2026-10-09).

[defaults]
country = "US"

[[instruments]]
short_name = "SOFR"
type = "rate_fixing"
currency = "USD"
calendar = "SIFMA-US"
description = "Secured Overnight Financing Rate (New York Fed): rate, percentiles and volume"
identifiers = { NYFED-SOFR = "SOFR" }
notes = [
  { key = "first-published", date = "2018-04-02", text = "First published, for 2018-04-02." },
]

[[instruments]]
short_name = "EFFR"
type = "rate_fixing"
currency = "USD"
calendar = "FED"
description = "Effective federal funds rate (New York Fed): rate, percentiles, volume and the FOMC's target range"
identifiers = { NYFED-EFFR = "EFFR" }
notes = [
  { key = "methodology-2016", date = "2016-03-01", text = "The New York Fed began calculating EFFR as a volume-weighted median of FR 2420 data (from a volume-weighted mean of brokered trades)." },
]

