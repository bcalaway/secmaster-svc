# CME rates and FX futures: the security master's product seed (mkt-data's docs/phase-4.md, step 2a).
#
# One entry per product. Like seeds/cmt.toml it's the source of truth, changed only in a reviewed PR, but
# it isn't an instrument seed: app/futures_load.py reads it (POST /jobs/futures, the daily DAG
# secmaster_svc__futures), makes each product an instrument named by its Bloomberg root (`TY`) and
# generates every contract from the rules here and calendar-svc's business days (app/futures.py).
#
# - `rules` name the date rules app/futures.py implements; `rule_sources` say where each comes from.
#   Trade rules count business days in `trade_calendars`, delivery and settlement rules in
#   `settle_calendars`. FX: CME's FX calendar and the Fed's (Chicago and New York bank holidays) to trade;
#   the delivery country's and the Fed's to deliver (CME rulebook, chapters 251-261).
# - `listing` is the cycle on CME's spec page: `quarterly` consecutive March-cycle contracts, `monthly`
#   consecutive months, `serial_nearest` non-quarterly months, or `serial_months`, the non-quarterly
#   months within that many months (an interpretation of "serial contracts listed for 16 months", to
#   confirm).
# - `history_from`: contracts expiring on or after it are generated (1990 or launch, Bill 2026-10-08);
#   absent: only what's listed today, until the launch date is found. `history_source` says which.
# - `specs` are effective-dated, verbatim from CME's spec pages as read on 2026-10-08 into mkt-data's
#   docs/cme-contract-specs-2026-10.md. Earlier specs aren't recorded yet, so each starts on the date read.
# - Bloomberg roots come from the phase plan or CME's overview pages; `root_confirmed = false` until
#   OpenFIGI confirms them (step 2b). A root change renames contracts and keeps their sec_ids.

read_on = 2026-10-08
reference = "mkt-data docs/cme-contract-specs-2026-10.md"

[[products]]
root = "TU"
root_confirmed = false
root_source = "mkt-data docs/phase-4.md, Products table (Bloomberg roots as planned; confirmed through OpenFIGI in step 2b)"
cme_code = "ZT"
clearing_code = "26"
name = "2-Year T-Note Futures"
kind = "treasury"
currency = "USD"
trade_calendars = ["CME-IR"]
settle_calendars = ["CME-IR"]
generics = 3
history_source = "Launch date not confirmed (CME's 2020 article marks 30 years of the 2-year note, so 1990, day unknown): only contracts listed today until it's found."
listing = { quarterly = 3 }
rules = { last_trade_date = "last_bd", first_intention_date = "first_bd_minus:2", first_notice_date = "first_bd_minus:1", first_delivery_date = "first_bd", last_delivery_date = "last_bd_plus:3" }
[products.rule_sources]
last_trade_date = "spec page, Termination of trading: the last business day of the contract month"
first_intention_date = "CBOT Treasury delivery practice: position (intention) day is two business days before the first delivery day. Not on the spec page; to confirm against the CBOT rulebook's delivery chapter"
first_notice_date = "CBOT Treasury delivery practice: notice day is the business day after position day. Not on the spec page; to confirm against the CBOT rulebook's delivery chapter"
first_delivery_date = "CBOT rulebook chapter (read 2026-10-08): delivery on any business day of the contract month"
last_delivery_date = "spec page, Last delivery date: third business day following the last trading day"
[[products.specs]]
valid_from = 2026-10-08
source = "https://www.cmegroup.com/markets/interest-rates/us-treasury/2-year-us-treasury-note.contractSpecs.html"
contract_unit = "Face value at maturity of $200,000"
minimum_price_fluctuation = """
1/8 of 1/32 of one point (0.00390625) = $7.8125
TAS: Zero or +/- 4 ticks in the minimum tick increment of the outright"""
listed_contracts = """
Quarterly contracts (Mar, Jun, Sep, Dec) listed for 3 consecutive quarters
TAS: A new TAS month will be listed on the 15th calendar day 3 months prior to the first day of the delivery month. Two TAS months (and corresponding calendar spread) will be supported for the two weeks prior to the nearer month's expiration."""
termination_of_trading = """
Trading terminates at 12:01 p.m.CT  on the last business day of the contract month
TAS:Trading terminates at 2:00 p.m.CT on the last business day of the calendar month preceding the contract month"""
settlement_method = "Deliverable"
settlement_procedures = "Treasury Settlement Procedures (link)"
trading_hours = """
CME Globex:
Sunday - Friday 6:00 p.m. - 5:00 p.m.ET (5:00 p.m. - 4:00 p.m. CT).  Monday - Thursday 5:00 p.m. - 6:00 p.m. ET (4:00 p.m. - 5:00 p.m. CT) daily maintenance period.
TAS: Sunday - Friday 6:00 p.m. - 3:00 p.m. ET (5:00 p.m. - 2:00 p.m. CT)
CME ClearPort:
Sunday 5:00 p.m. - Friday 5:45 p.m. CT with no reporting Monday - Thursday from 5:45 p.m. - 6:00 p.m. CT
TAS: Sunday 5:00 p.m. (6:00 p.m. ET) - Friday 2:00 p.m. - (3:00 p.m. ET) with a pause from 2:00 p.m. - 6:00 p.m. CT (3:00 p.m. - 7:00 p.m. ET), Monday - Thursday"""
vendor_codes = "not shown (specs page links to \"Quote Vendor Symbols Listing\"; product has no Overview tab with a vendor-codes table)"

