# CME rates and FX futures: the security master's product seed (mkt-data's docs/phase-4.md, steps 2a, 2c and 2d).
#
# One entry per product. Like seeds/cmt.toml it's the source of truth, changed only in a reviewed PR, but
# it isn't an instrument seed: app/futures_load.py reads it (POST /jobs/futures, the daily DAG
# secmaster_svc__futures), makes each product an instrument named by its Bloomberg root (`TY`) and
# generates every contract from the rules here and calendar-svc's business days (app/futures.py).
#
# - `rules` name the date rules app/futures.py implements; `rule_sources` say where each comes from.
#   Trade rules count business days in `trade_calendars`, delivery and settlement rules in
#   `settle_calendars`. FX: CME's FX calendar and the Fed's (Chicago and New York bank holidays) to trade;
#   the delivery country's and the Fed's to deliver (CME rulebook, chapters 251-261).
#   A cross (step 2c, from the products at the end) delivers where both its currencies and New York are
#   open: both countries' calendars and the Fed's, assumed from the majors until its chapter is read.
# - `kind`: treasury (deliverable: intention, notice and delivery days), treasury_cash (the micro Ultras and
#   the yield futures, settled in cash at the last trade), stir, fx (deliverable) or fx_cash (financially
#   settled against a fixing: most of step 2d's emerging-market contracts, so no delivery date).
# - A rule can name its own calendars after `@` (`third_wed_minus:2@HK`), where CME's spec page counts in
#   the local market's business days (step 2d).
# - `listing` is the cycle on CME's spec page: `quarterly` consecutive March-cycle contracts, `monthly`
#   consecutive months, `serial_nearest` non-quarterly months, or `serial_months`, the non-quarterly
#   months within that many months (an interpretation of "serial contracts listed for 16 months", to
#   confirm).
#   `monthly` with `quarterly_after`: that many consecutive months, then that many March-cycle months
#   after them ("13 consecutive months and 8 quarterly contracts", step 2d).
# - `history_from`: contracts expiring on or after it are generated (1990 or launch, Bill 2026-10-08);
#   absent: only what's listed today, until the launch date is found. `history_source` says which.
# - `cftc_code` (step 5): the CFTC's contract market code for the product, where its Traders in Financial
#   Futures report has one; quote-svc puts the weekly positions on the product through it. `cftc_source`
#   says which reports name it. Codes are read from the reports mkt-data captured, never from memory.
# - `basket` (Treasury futures, step 3): the deliverable grade from the product's CBOT chapter, in months
#   from the first day of the contract month (app/baskets.py); its `source` quotes the chapter.
# - `specs` are effective-dated, verbatim from CME's spec pages as read on 2026-10-08 into mkt-data's
#   docs/cme-contract-specs-2026-10.md. Earlier specs aren't recorded yet, so each starts on the date read.
# - Bloomberg roots come from the phase plan or CME's overview pages; `root_confirmed = true` once
#   OpenFIGI finds every listed contract by that ticker and they're all the one future, checked by name
#   in the futures FIGI job's log (step 2b, 2026-10-08). A root change renames contracts and keeps their
#   sec_ids.

read_on = 2026-10-08
reference = "mkt-data docs/cme-contract-specs-2026-10.md"

[[products]]
root = "TU"
root_confirmed = true
root_source = "mkt-data docs/phase-4.md, Products table (Bloomberg roots as planned; confirmed through OpenFIGI in step 2b); confirmed 2026-10-08 through OpenFIGI (secmaster-svc's futures FIGI job): all 3 listed contracts found by ticker, all one future, \"US 2YR NOTE (CBT)\" (TUZ6 Comdty, CBT)"
cme_code = "ZT"
cftc_code = "042601"
cftc_source = "CFTC Traders in Financial Futures reports (one June a year from 2006, and 2026-10-06): market 042601, 2-YEAR U.S. TREASURY NOTES / UST 2Y NOTE - CHICAGO BOARD OF TRADE"
clearing_code = "26"
name = "2-Year T-Note Futures"
kind = "treasury"
currency = "USD"
trade_calendars = ["CME-IR"]
settle_calendars = ["CME-IR"]
generics = 3
history_from = 1990-06-22
history_source = "CME Group, Historical First Trade Dates (https://www.cmegroup.com/media-room/historical-first-trade-dates.html, read 2026-10-10), Interest Rates, \"2-Year Treasury Note\": futures 6/22/1990. CME OpenMarkets (2020-06-25) also: \"launched in June 1990\"."
listing = { quarterly = 3 }
rules = { last_trade_date = "last_bd", first_intention_date = "first_bd_minus:2", first_notice_date = "first_bd_minus:1", first_delivery_date = "first_bd", last_delivery_date = "last_bd_plus:3" }
[products.rule_sources]
last_trade_date = "spec page, Termination of trading: the last business day of the contract month"
first_intention_date = "CBOT rulebook chapter 21 (read 2026-10-10, https://www.cmegroup.com/rulebook/CBOT/II/21.pdf), rule 21104: deliveries can be made no earlier than the first business day of the contract month (rule 21103); 21104.A Day of Intention: \"No later than 6:00 p.m. on the second business day preceding the intended day of delivery, the short Clearing Member must tender to the Clearing House all notices of intention to make delivery\". So the first intention day is the second business day before the month's first business day"
first_notice_date = "CBOT rulebook chapter 21 (read 2026-10-10), rule 21105.B Day of Notification: each short Clearing Member \"shall submit said invoices to the Clearing House by 2:00 p.m. on the business day preceding the day of delivery\", and the Clearing House furnishes them to the long Clearing Members; so the first notice day is the business day before the first delivery day"
first_delivery_date = "CBOT rulebook chapter (read 2026-10-08): delivery on any business day of the contract month"
last_delivery_date = "spec page, Last delivery date: third business day following the last trading day"
[products.basket]
source = "CBOT 21 (read 2026-10-09): an original term to maturity of not more than 5 years 3 months, a remaining term of not more than 2 years and not less than 1 year 9 months, calculated from the first day of the contract's named month and rounded down to the nearest one-month increment"
remaining_min_months = 21
remaining_max_months = 24
original_max_months = 63
rounding = "month"
