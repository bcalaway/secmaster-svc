# Treasury constant-maturity (CMT) yields: the security master's seed for them
# (mkt-data's docs/phase-2.md, Part B step 4; Bill, 2026-10-04).
#
# CMTs aren't in any feed, so this file is their source of truth. The seed job
# (app/seed.py) applies it at every start and on POST /jobs/seed: it's
# idempotent, keeps sec_ids stable by short name, closes identifiers and names
# the file no longer lists rather than deleting them, and never touches an
# instrument it doesn't list. Change it in a reviewed PR, never in the database.
#
# Identifier schemes are mkt-data's source names, and values are that source's
# own keys, so quote-svc maps an observation (source, source_key) straight to
# an instrument:
#   UST-PAR  Treasury's daily par yield curve, element name (BC_10YEAR)
#   H15-TCM  the Fed's H.15 release, series code (RIFLGFCY10_N.B); H.15 has
#            no 1.5-, 2- or 4-month series
#   FRED     St. Louis Fed's copy of H.15, for reference (DGS10)
#
# Dates in notes come from Treasury's and the Fed's published notes on the
# series. Step B6 (the backfill) checks each against the captured data and
# corrects this file where they differ.

[defaults]
type = "cmt_yield"
currency = "USD"
country = "US"
curve = "UST"
calendar = "SIFMA-US"

# Notes that apply to every CMT.
[[notes]]
key = "par-curve-method-2021"
date = "2021-12-06"
text = "Treasury's par yield curve moved from a quasi-cubic Hermite spline to a monotone convex method. The series continues; values before and after aren't from the same method."

[[instruments]]
short_name = "UST-1M-CMT"
tenor = "P1M"
description = "US Treasury 1-month constant maturity yield"
identifiers = { UST-PAR = "BC_1MONTH", H15-TCM = "RIFLGFCM01_N.B", FRED = "DGS1MO" }
notes = [
  { key = "first-published", date = "2001-07-31", text = "First published; no 1-month CMT before this date." },
]

[[instruments]]
short_name = "UST-1.5M-CMT"
aliases = ["UST-6W-CMT"]
tenor = "P6W"
description = "US Treasury 1.5-month (6-week) constant maturity yield"
identifiers = { UST-PAR = "BC_1_5MONTH" }
notes = [
  { key = "first-published", date = "2025-02-18", text = "First published, after Treasury began issuing the 6-week bill. Treasury only; H.15 has no 1.5-month series." },
]

