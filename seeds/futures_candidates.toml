# Futures products for step 2c (mkt-data's docs/phase-4.md) whose Bloomberg root isn't known yet: none of
# their CME pages shows a vendor code (docs/cme-contract-specs-2026-10.md), and OpenFIGI can't map CME's
# code. The root-search job (app/futures_roots.py, DAG secmaster_svc__futures_roots) searches OpenFIGI for
# each by these queries and logs the futures it finds, grouped by root and name, for a person to read.
# Nothing here is stored: a root goes into seeds/futures.toml, in a reviewed PR, once its name checks out.
# Not an instrument seed (app/seed.py skips it).
#
# - `cme_code`, `name`: as on CME's spec page.
# - `sector`: Bloomberg's market sector, from `kind` (Curncy for FX, Comdty for rates).
# - `exch_code`: Bloomberg's exchange code for the matches to keep: CME or CBT, as for the main 20 (step 2b).
# - `queries`: OpenFIGI search text, tried in order; guesses at Bloomberg's naming, which the log shows.

[[candidates]]
cme_code = "SEK"
name = "Swedish Krona Futures"
kind = "fx"
exch_code = "CME"
queries = ["SEK CURRENCY", "SWEDISH KRONA", "SEKUSD"]

